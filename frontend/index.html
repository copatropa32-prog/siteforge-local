<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteForge Local - Painel Multi-Agentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-400">SiteForge Local</h1>
                <p class="text-slate-400">Construtor autônomo de aplicações com IA local e Multi-Agentes</p>
            </div>
            <button onclick="baixarProjeto()" class="bg-indigo-600 hover:bg-indigo-700 transition font-medium px-4 py-2.5 rounded-xl text-sm flex items-center gap-2 shadow-lg">
                📦 Baixar Projeto (ZIP)
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Coluna 1: Configurações, Criação e Refinamento -->
            <div class="space-y-6 lg:col-span-1">
                <!-- Painel de Configurações -->
                <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-bold mb-4">⚙️ Configurações</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Modelo de IA (Ollama)</label>
                            <input id="model" type="text" placeholder="ex: llama3, mistral, codellama" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Domínio Personalizado</label>
                            <input id="domain" type="text" placeholder="ex: meudominio.com.br" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Variáveis de Ambiente (JSON)</label>
                            <input id="env_vars" type="text" placeholder='{"CHAVE": "valor"}' class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <button onclick="salvarConfig()" class="mt-4 bg-blue-600 hover:bg-blue-700 transition font-medium px-5 py-2.5 rounded-xl w-full">Salvar Configurações</button>
                </section>

                <!-- Painel de Geração de Projetos -->
                <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-bold mb-4">🚀 Criar Aplicativo</h2>
                    <div class="flex flex-col gap-4">
                        <textarea id="prompt" rows="3" placeholder="Descreva o que deseja criar do zero..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500"></textarea>
                        <button onclick="gerarProjeto()" id="btnGerar" class="bg-emerald-600 hover:bg-emerald-700 transition font-medium px-5 py-3 rounded-xl w-full">Executar Agentes de IA</button>
                    </div>
                </section>

                <!-- Painel de Modificação Cirúrgica -->
                <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-bold mb-4">💬 Refinar Projeto</h2>
                    <div class="flex flex-col gap-4">
                        <textarea id="modifyPrompt" rows="3" placeholder="Ex: Mude a cor do botão para azul..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500"></textarea>
                        <button onclick="modificarProjeto()" id="btnModificar" class="bg-purple-600 hover:bg-purple-700 transition font-medium px-5 py-3 rounded-xl w-full">Aplicar Modificação Cirúrgica</button>
                    </div>
                </section>

                <!-- Terminal Visual de Logs em Tempo Real -->
                <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-bold mb-3">💻 Terminal dos Agentes</h2>
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl h-36 overflow-y-auto font-mono text-xs text-emerald-400" id="terminalLog">
                        Aguardando início das tarefas...
                    </div>
                </section>
            </div>

            <!-- Coluna 2 e 3: Editor de Código Interativo e Live Preview -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:col-span-2">
                <!-- Editor de Código -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold">📁 Editor de Arquivos</h2>
                        <div class="flex gap-2">
                            <button onclick="criarArquivoManual()" class="bg-emerald-600 hover:bg-emerald-700 text-xs px-3 py-1.5 rounded-lg font-medium transition">➕ Novo Arquivo</button>
                            <button onclick="salvarArquivoAtual()" id="btnSalvarArquivo" class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-1.5 rounded-lg font-medium transition hidden">💾 Salvar Alterações</button>
                        </div>
                    </div>
                    <div id="fileList" class="flex flex-wrap gap-2 mb-4">
                        <span class="text-sm text-slate-500">Nenhum arquivo gerado ainda.</span>
                    </div>
                    <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex flex-col min-h-[300px]">
                        <div id="currentFileName" class="bg-slate-900 px-4 py-2 border-b border-slate-800 text-xs text-slate-400">Selecione um arquivo</div>
                        <textarea id="fileCode" class="w-full flex-1 bg-slate-950 p-4 text-xs text-emerald-400 font-mono focus:outline-none resize-none" placeholder="O código aparecerá aqui para edição..."></textarea>
                    </div>
                </div>

                <!-- Live Preview -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold">👁️ Live Preview</h2>
                        <button onclick="atualizarPreview()" class="text-xs text-blue-400 hover:underline">Recarregar</button>
                    </div>
                    <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden min-h-[350px] flex flex-col">
                        <div class="bg-slate-900 px-4 py-2 border-b border-slate-800 text-xs text-slate-400" id="previewStatus">Aguardando...</div>
                        <iframe id="previewFrame" src="about:blank" class="w-full flex-1 bg-white border-none"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFileActive = null;

        async function carregarConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                document.getElementById('model').value = data.model || 'llama3';
                document.getElementById('domain').value = data.domain || '';
                document.getElementById('env_vars').value = data.env_vars || '';
            } catch (e) {
                console.error("Erro ao carregar configurações", e);
            }
        }

        async function salvarConfig() {
            const config = {
                model: document.getElementById('model').value || 'llama3',
                domain: document.getElementById('domain').value,
                env_vars: document.getElementById('env_vars').value
            };
            await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(config)
            });
            alert('Configurações salvas!');
        }

        async function carregarArquivos() {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();
                const fileListDiv = document.getElementById('fileList');
                fileListDiv.innerHTML = '';

                if (files.length === 0) {
                    fileListDiv.innerHTML = '<span class="text-sm text-slate-500">Nenhum arquivo gerado ainda.</span>';
                    return;
                }

                files.forEach(file => {
                    const container = document.createElement('div');
                    container.className = 'flex items-center bg-slate-800 border border-slate-700 rounded-lg overflow-hidden text-xs';

                    const btn = document.createElement('button');
                    btn.className = 'px-3 py-1.5 hover:bg-slate-700 transition text-slate-200';
                    btn.innerText = file;
                    btn.onclick = () => verConteudoArquivo(file);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'px-2 py-1.5 text-red-400 hover:bg-red-950 transition border-l border-slate-700';
                    delBtn.innerText = '✕';
                    delBtn.title = 'Excluir arquivo';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deletarArquivo(file);
                    };

                    container.appendChild(btn);
                    container.appendChild(delBtn);
                    fileListDiv.appendChild(container);
                });
            } catch (e) {
                console.error("Erro ao carregar lista de arquivos", e);
            }
        }

        async function verConteudoArquivo(path) {
            currentFileActive = path;
            try {
                const res = await fetch(`/api/file-content?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                document.getElementById('currentFileName').innerText = path;
                document.getElementById('fileCode').value = data.content;
                document.getElementById('btnSalvarArquivo').classList.remove('hidden');
            } catch (e) {
                alert('Erro ao carregar o arquivo.');
            }
        }

        async function salvarArquivoAtual() {
            if (!currentFileActive) return;
            const content = document.getElementById('fileCode').value;
            try {
                const res = await fetch('/api/file-content', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path: currentFileActive, content })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    alert('Arquivo salvo com sucesso!');
                    atualizarPreview();
                } else {
                    alert('Erro ao salvar arquivo.');
                }
            } catch (e) {
                alert('Falha na comunicação ao salvar arquivo.');
            }
        }

        async function criarArquivoManual() {
            const path = prompt("Digite o nome do novo arquivo (ex: contato.html, styles.css):");
            if (!path) return;
            try {
                const res = await fetch('/api/file-create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    await carregarArquivos();
                    verConteudoArquivo(path);
                    atualizarPreview();
                } else {
                    alert('Erro ao criar arquivo.');
                }
            } catch (e) {
                alert('Falha na comunicação ao criar arquivo.');
            }
        }

        async function deletarArquivo(path) {
            if (!confirm(`Deseja realmente excluir o arquivo "${path}"?`)) return;
            try {
                const res = await fetch('/api/file-delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    if (currentFileActive === path) {
                        currentFileActive = null;
                        document.getElementById('currentFileName').innerText = 'Selecione um arquivo';
                        document.getElementById('fileCode').value = '';
                        document.getElementById('btnSalvarArquivo').classList.add('hidden');
                    }
                    await carregarArquivos();
                    atualizarPreview();
                } else {
                    alert('Erro ao excluir arquivo.');
                }
            } catch (e) {
                alert('Falha na comunicação ao excluir arquivo.');
            }
        }

        function baixarProjeto() {
            window.location.href = '/api/download';
        }

        async function gerarProjeto() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) {
                alert('Por favor, descreva o projeto.');
                return;
            }
            const btn = document.getElementById('btnGerar');
            const status = document.getElementById('previewStatus');
            const frame = document.getElementById('previewFrame');
            const terminal = document.getElementById('terminalLog');

            btn.disabled = true;
            btn.innerText = 'Agentes trabalhando...';
            status.innerText = 'Processando com IA...';

            const logInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    terminal.innerText += '\n' + data.status;
                    terminal.scrollTop = terminal.scrollHeight;
                } catch (e) {
                    console.error("Erro ao buscar logs", e);
                }
            }, 500);

            try {
                const response = await fetch('/api/gerar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                
                clearInterval(logInterval);

                if (data.status === 'success') {
                    status.innerText = 'Projeto gerado com sucesso!';
                    terminal.innerText += '\n✅ Processo concluído com sucesso!';
                    frame.src = data.preview_url + '?t=' + new Date().getTime();
                    await carregarArquivos();
                } else {
                    status.innerText = 'Erro ao gerar projeto.';
                }
            } catch (e) {
                clearInterval(logInterval);
                status.innerText = 'Falha de comunicação.';
                terminal.innerText += '\n❌ Erro crítico de comunicação.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Executar Agentes de IA';
            }
        }

        async function modificarProjeto() {
            const prompt = document.getElementById('modifyPrompt').value;
            if (!prompt) {
                alert('Por favor, descreva a modificação desejada.');
                return;
            }
            const btn = document.getElementById('btnModificar');
            const status = document.getElementById('previewStatus');
            const frame = document.getElementById('previewFrame');
            const terminal = document.getElementById('terminalLog');

            btn.disabled = true;
            btn.innerText = 'Modificando...';
            status.innerText = 'Aplicando modificação...';

            const logInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    terminal.innerText += '\n' + data.status;
                    terminal.scrollTop = terminal.scrollHeight;
                } catch (e) {
                    console.error("Erro ao buscar logs", e);
                }
            }, 500);

            try {
                const response = await fetch('/api/modificar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                
                clearInterval(logInterval);

                if (data.status === 'success') {
                    status.innerText = 'Modificação aplicada com sucesso!';
                    terminal.innerText += '\n✅ Modificação concluída com sucesso!';
                    frame.src = data.preview_url + '?t=' + new Date().getTime();
                    await carregarArquivos();
                    document.getElementById('modifyPrompt').value = '';
                } else {
                    status.innerText = 'Erro ao modificar projeto.';
                }
            } catch (e) {
                clearInterval(logInterval);
                status.innerText = 'Falha de comunicação.';
                terminal.innerText += '\n❌ Erro crítico de comunicação.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Aplicar Modificação Cirúrgica';
            }
        }

        function atualizarPreview() {
            const frame = document.getElementById('previewFrame');
            frame.src = frame.src;
        }

        carregarConfig();
        carregarArquivos();
    </script>
</body>
</html>
