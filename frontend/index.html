<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteForge IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        /* Ajuste fino para o layout de IDE */
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .sidebar-item:hover { background-color: #1e293b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 flex h-screen">

    <!-- 1. SIDEBAR (Explorador de Arquivos) -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col flex-none">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <h2 class="font-bold text-sm text-slate-400 uppercase tracking-wider">Arquivos</h2>
            <button onclick="criarArquivoManual()" class="text-emerald-500 hover:text-emerald-400 font-bold">+</button>
        </div>
        <div id="fileList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Arquivos aparecerão aqui -->
        </div>
        <div class="p-4 border-t border-slate-800">
            <button onclick="baixarProjeto()" class="w-full bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded">Exportar ZIP</button>
        </div>
    </aside>

    <!-- 2. MAIN WORKSPACE (Editor + Terminal) -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Toolbar Superior -->
        <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center px-4 justify-between">
            <div id="currentFileName" class="text-sm font-medium">Nenhum arquivo</div>
            <div class="flex gap-2">
                <button onclick="salvarArquivoAtual()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-xs">Salvar</button>
                <button onclick="gerarProjeto()" class="bg-emerald-600 hover:bg-emerald-700 px-3 py-1 rounded text-xs">Gerar</button>
            </div>
        </header>

        <!-- Editor (Monaco) -->
        <div id="editorContainer" class="flex-1 w-full bg-slate-950"></div>

        <!-- Painel Inferior (Terminal + Preview) -->
        <section class="h-48 border-t border-slate-800 bg-slate-900 flex">
            <!-- Terminal Log -->
            <div class="w-1/2 border-r border-slate-800 p-4 flex flex-col">
                <h3 class="text-xs font-bold text-slate-500 mb-2 uppercase">Terminal</h3>
                <div id="terminalLog" class="flex-1 overflow-y-auto font-mono text-xs text-emerald-400">Aguardando...</div>
            </div>
            <!-- Preview -->
            <div class="w-1/2 p-0">
                <iframe id="previewFrame" src="about:blank" class="w-full h-full border-none"></iframe>
            </div>
        </section>
    </main>

    <script>
        // --- Monaco Editor ---
        let editor;
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editorContainer'), {
                value: '// Selecione um arquivo na sidebar...',
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true
            });
        });

        let currentFileActive = null;

        // --- Lógica ---
        async function carregarArquivos() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'sidebar-item flex justify-between items-center px-2 py-1.5 rounded cursor-pointer text-sm';
                item.onclick = () => verConteudoArquivo(file);
                item.innerHTML = `<span>${file}</span> <button onclick="event.stopPropagation(); deletarArquivo('${file}')" class="text-slate-600 hover:text-red-400">✕</button>`;
                list.appendChild(item);
            });
        }

        async function verConteudoArquivo(path) {
            currentFileActive = path;
            document.getElementById('currentFileName').innerText = path;
            const res = await fetch(`/api/file-content?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            const model = monaco.editor.createModel(data.content, path.endsWith('.js') ? 'javascript' : (path.endsWith('.css') ? 'css' : 'html'));
            editor.setModel(model);
        }

        async function salvarArquivoAtual() {
            if (!currentFileActive) return;
            await fetch('/api/file-content', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ path: currentFileActive, content: editor.getValue() })
            });
            logTerminal("Arquivo salvo com sucesso.");
            atualizarPreview();
        }

        async function logTerminal(msg) {
            const terminal = document.getElementById('terminalLog');
            terminal.innerText += `\n> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function gerarProjeto() {
            const prompt = prompt("O que você deseja construir?");
            if (!prompt) return;
            logTerminal("Agentes trabalhando...");
            await fetch('/api/gerar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt }) });
            carregarArquivos();
            atualizarPreview();
        }

        async function criarArquivoManual() {
            const path = prompt("Nome do arquivo:");
            if(!path) return;
            await fetch('/api/file-create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path }) });
            carregarArquivos();
        }

        async function deletarArquivo(path) {
            if(!confirm("Excluir?")) return;
            await fetch('/api/file-delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path }) });
            carregarArquivos();
        }

        function atualizarPreview() {
            document.getElementById('previewFrame').src = '/preview/index.html?t=' + Date.now();
        }

        function baixarProjeto() { window.location.href = '/api/download'; }

        carregarArquivos();
    </script>
</body>
</html>
