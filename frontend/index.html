<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteForge Local - Professional IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carregando o Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-400">SiteForge Local</h1>
                <p class="text-slate-400">Ambiente de Desenvolvimento Multi-Agentes</p>
            </div>
            <button onclick="baixarProjeto()" class="bg-indigo-600 hover:bg-indigo-700 transition font-medium px-4 py-2.5 rounded-xl text-sm flex items-center gap-2 shadow-lg">
                📦 Baixar Projeto (ZIP)
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Coluna 1 -->
            <div class="space-y-6 lg:col-span-1">
                <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-bold mb-4">⚙️ Configurações</h2>
                    <div class="space-y-3">
                        <input id="model" type="text" placeholder="Modelo (ex: llama3)" class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-sm">
                        <button onclick="salvarConfig()" class="bg-blue-600 hover:bg-blue-700 w-full py-2 rounded-lg text-sm font-medium">Salvar Config</button>
                    </div>
                </section>

                <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-xl font-bold mb-4">🚀 Criar & Modificar</h2>
                    <textarea id="prompt" rows="3" placeholder="O que deseja construir?" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl mb-2 text-sm"></textarea>
                    <div class="flex gap-2">
                        <button onclick="gerarProjeto()" class="bg-emerald-600 hover:bg-emerald-700 flex-1 py-2 rounded-xl text-sm">Criar</button>
                        <button onclick="modificarProjeto()" class="bg-purple-600 hover:bg-purple-700 flex-1 py-2 rounded-xl text-sm">Refinar</button>
                    </div>
                </section>
            </div>

            <!-- Coluna 2 e 3: Editor Profissional e Preview -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:col-span-2">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold" id="currentFileName">Editor</h2>
                        <button onclick="salvarArquivoAtual()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-xs">💾 Salvar</button>
                    </div>
                    <div id="fileList" class="flex flex-wrap gap-2 mb-4 text-xs"></div>
                    <!-- Container do Monaco Editor -->
                    <div id="editorContainer" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl min-h-[400px]"></div>
                </div>

                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg flex flex-col">
                    <h2 class="text-xl font-bold mb-4">👁️ Live Preview</h2>
                    <div class="flex-1 bg-white rounded-xl overflow-hidden min-h-[400px]">
                        <iframe id="previewFrame" src="about:blank" class="w-full h-full border-none"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inicialização do Monaco Editor
        let editor;
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editorContainer'), {
                value: '// Selecione um arquivo para começar...',
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14
            });
        });

        let currentFileActive = null;

        // Funções auxiliares de linguagem
        function getLanguage(filename) {
            if (filename.endsWith('.html')) return 'html';
            if (filename.endsWith('.css')) return 'css';
            if (filename.endsWith('.js')) return 'javascript';
            if (filename.endsWith('.json')) return 'json';
            return 'plaintext';
        }

        async function verConteudoArquivo(path) {
            currentFileActive = path;
            document.getElementById('currentFileName').innerText = path;
            const res = await fetch(`/api/file-content?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            
            // Atualiza o modelo do Monaco
            const oldModel = editor.getModel();
            const newModel = monaco.editor.createModel(data.content, getLanguage(path));
            editor.setModel(newModel);
            if (oldModel) oldModel.dispose();
        }

        async function salvarArquivoAtual() {
            if (!currentFileActive) return;
            const content = editor.getValue(); // Pega do Monaco
            await fetch('/api/file-content', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ path: currentFileActive, content })
            });
            alert('Salvo!');
            atualizarPreview();
        }

        // --- Funções mantidas do seu projeto ---
        async function carregarArquivos() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            files.forEach(file => {
                const btn = document.createElement('button');
                btn.className = 'px-2 py-1 bg-slate-800 rounded hover:bg-slate-700';
                btn.innerText = file;
                btn.onclick = () => verConteudoArquivo(file);
                list.appendChild(btn);
            });
        }

        // (Inclua aqui as funções gerarProjeto, modificarProjeto, carregarConfig, salvarConfig, deletarArquivo como estavam anteriormente)
        // ... (Para manter este arquivo curto, certifique-se de copiar as funções de fetch das chamadas de API do seu código antigo)
        
        carregarArquivos();
    </script>
</body>
</html>
